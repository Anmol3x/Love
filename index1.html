<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Do you Love me ❤️?</title>

<style>
body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;

    background: linear-gradient(rgba(255,105,180,0.6), rgba(255,182,193,0.6)),
    url("https://i.imgur.com/4iBKHAD.jpeg");
    background-size: cover;
    background-position: center;
}

.container {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    padding: 25px;
    border-radius: 20px;
    text-align: center;
    color: white;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

h1 {
    font-size: 1.8rem;
    margin-bottom: 15px;
}

img {
    width: 180px;
    max-width: 70%;
    border-radius: 15px;
    margin-bottom: 15px;
}

.buttons {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
    height: 120px;
}

/* ✅ SAME SIZE BUTTONS */
button {
    width: 140px;
    height: 45px;
    font-size: 14px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    transition: 0.25s ease;

    display: flex;
    justify-content: center;
    align-items: center;
}

/* 💖 YES BUTTON */
#yesBtn {
    background: linear-gradient(45deg, #ff2e63, #ff6f91);
    color: white;
    box-shadow: 0 5px 15px rgba(255, 0, 80, 0.4);
}

#yesBtn:hover {
    transform: scale(1.1);
}

#yesBtn:active {
    transform: scale(0.95);
}

/* 😈 NO BUTTON */
#btn {
    position: relative; /* starts inline */
    background: linear-gradient(45deg, #555, #222);
    color: white;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

#btn:hover {
    animation: shake 0.3s;
}

@keyframes shake {
    0% { transform: translateX(0); }
    25% { transform: translateX(-3px); }
    50% { transform: translateX(3px); }
    75% { transform: translateX(-3px); }
    100% { transform: translateX(0); }
}

/* ❤️ Hearts */
.heart {
    position: absolute;
    font-size: 16px;
    animation: floatUp 2.5s linear forwards;
    pointer-events: none;
}

@keyframes floatUp {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(-250px); opacity: 0; }
}

/* 💥 Explosion */
.particle {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: red;
    pointer-events: none;
    animation: explode 700ms ease-out forwards;
}

@keyframes explode {
    to {
        transform: translate(var(--x), var(--y));
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>Do you love me? ❤️</h1>

    <img src="https://i.imgur.com/AS2jNTC.gif" alt="Cute">

    <div class="buttons">
        <button id="yesBtn">Yes 💖</button>
        <button id="btn">No 😢</button>
    </div>
</div>

<script>
const noBtn = document.getElementById("btn");
const yesBtn = document.getElementById("yesBtn");

let moveCount = 0;

const texts = [
    "No 😢",
    "Are you sure? 😏",
    "Really sure? 🤨",
    "Think again 😜",
    "Last chance 😈"
];

function moveButton() {
    moveCount++;

    // change text
    if (moveCount < texts.length) {
        noBtn.innerText = texts[moveCount];
    }

    // make it absolute when moving
    noBtn.style.position = "absolute";

    const container = document.querySelector(".container");
    const rect = container.getBoundingClientRect();

    let x, y;

    if (moveCount <= 5) {
        x = rect.left + Math.random() * (rect.width - noBtn.offsetWidth);
        y = rect.top + Math.random() * (rect.height - noBtn.offsetHeight);
    } else {
        x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
        y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
    }

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}

noBtn.addEventListener("mouseover", moveButton);
noBtn.addEventListener("touchstart", moveButton);

// ❤️ Hearts
function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "💖";

    heart.style.left = Math.random() * window.innerWidth + "px";
    heart.style.top = window.innerHeight + "px";

    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 2500);
}

setInterval(createHeart, 600);

// 💥 Explosion
function explode(x, y) {
    for (let i = 0; i < 20; i++) {
        const p = document.createElement("div");
        p.className = "particle";

        const angle = Math.random() * 2 * Math.PI;
        const distance = Math.random() * 100;

        p.style.left = x + "px";
        p.style.top = y + "px";
        p.style.setProperty('--x', Math.cos(angle) * distance + "px");
        p.style.setProperty('--y', Math.sin(angle) * distance + "px");

        document.body.appendChild(p);
        setTimeout(() => p.remove(), 700);
    }
}

yesBtn.addEventListener("click", () => {
    const rect = yesBtn.getBoundingClientRect();
    explode(rect.left + rect.width / 2, rect.top + rect.height / 2);

    setTimeout(() => {
        window.location.href = "love.html";
    }, 600);
});
</script>

</body>
</html>
