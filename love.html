<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yay ❤️</title>

<style>
body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;

    background: linear-gradient(rgba(255,105,180,0.6), rgba(255,182,193,0.6)),
    url("https://i.imgur.com/4iBKHAD.jpeg");
    background-size: cover;
    background-position: center;
}

.container {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    padding: 25px;
    border-radius: 20px;
    text-align: center;
    color: white;
    max-width: 320px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

h1 {
    font-size: 1.8rem;
    margin-bottom: 10px;
}

p {
    font-size: 1rem;
    line-height: 1.5;
    margin-bottom: 15px;
}

/* 🎞️ GIF size (medium) */
img {
    width: 180px;
    max-width: 70%;
    border-radius: 15px;
    margin-top: 10px;
}

/* ❤️ Floating hearts */
.heart {
    position: absolute;
    font-size: 18px;
    animation: floatUp 3s linear forwards;
    pointer-events: none;
}

@keyframes floatUp {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(-300px); opacity: 0; }
}
</style>
</head>

<body>

<div class="container">
    <h1>Yay!! ❤️🥰</h1>

    <p>
        I knew it! 😍💖 <br>
        You just made my day so special ✨ <br>
        Stay like this forever ❤️
    </p>

    <!-- 🎞️ Your GIF -->
    <img src="https://i.imgur.com/5mYChqj.gif" alt="Love GIF">
</div>

<script>
// ❤️ Floating hearts animation
function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "💖";

    heart.style.left = Math.random() * window.innerWidth + "px";
    heart.style.top = window.innerHeight + "px";

    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 3000);
}

setInterval(createHeart, 500);
</script>

</body>
</html>
